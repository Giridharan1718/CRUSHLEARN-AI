[package]
name = "crushlearn-gateway"
version = "0.1.0"
edition = "2021"
description = "Server-side AI gateway for CrushLearn AI. Holds the provider key on the server and never ships it to the browser."
license = "MIT"
publish = false

[[bin]]
name = "crushlearn-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
