<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CrushLearn AI is a local-first learning workspace for source-grounded study, visual explanations and interactive practice."
    />
    <title>CrushLearn AI - Master Skills with AI Guidance</title>
    <script>
      // Apply the stored theme before first paint so the page never flashes
      // the wrong theme. Mirrors THEME_MODES/save logic in src/utils/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem('crushlearn_theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          /* Default to light when storage or matchMedia is unavailable. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
